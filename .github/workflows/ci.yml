name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Bridge.slnx

      - name: Build
        run: dotnet build Bridge.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Bridge.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

  deploy:
    runs-on: windows-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Blazor app
        run: dotnet publish Bridge.App/Bridge.App.csproj -c Release -o publish

      - name: Fix base href for GitHub Pages
        shell: pwsh
        run: |
          $file = "publish/wwwroot/index.html"
          (Get-Content $file) -replace '<base href="/" />', '<base href="/Bridge/" />' | Set-Content $file

      - name: Add .nojekyll
        shell: pwsh
        run: New-Item -ItemType File -Path publish/wwwroot/.nojekyll -Force

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
